name: AgentBuddy
options:
  bundleIdPrefix: com.akashark
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true

# DeveloperID is a release-style configuration used by the Mac Catalyst
# direct-distribution lane (notarized .dmg). It points the AgentBuddyMac target
# at a separate, unsandboxed entitlements file so the app can spawn a local
# `codex app-server`. The Mac App Store lane stays on Release with sandbox.
configs:
  Debug: debug
  Release: release
  DeveloperID: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/AgentBuddy/Bridge/codex_bridge_objc.h
    OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client"
    HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-device"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-sim"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: HNKUYWPBVC
    # Xcode 15+ explicit-module builds. First clean build is slightly
    # slower, but module graphs are cached per-target after that, so
    # incremental Swift compiles in the app target drop substantially.
    SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
    CLANG_ENABLE_EXPLICIT_MODULES: "YES"

packages:
  Hairball:
    url: https://github.com/dnakov/hairball.git
    branch: main
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  AgentBuddy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/AgentBuddy/AgentBuddy.entitlements
      properties:
        aps-environment: development
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: true
        com.apple.BackgroundModes:
          enabled: true
    sources:
      - path: Sources/AgentBuddy
        excludes:
          - "**/*.h"
          - "AppIcon.icon"
      - path: Sources/AgentBuddy/Bridge/UniFFICodexClient.generated.swift
      - path: Sources/AgentBuddyLiveActivity/CodexTurnLiveActivity.swift
      - path: Sources/AgentBuddyWatch/Models/WatchModels.swift
      - path: Sources/AgentBuddyWatch/Models/WatchSize.swift
      - path: Sources/AgentBuddyWatch/Models/WatchHapticDetector.swift
      - path: Sources/AgentBuddyWatch/Models/WatchSnapshotStore.swift
      - path: Sources/AgentBuddyWatch/Models/WatchDeepLinkRouter.swift
      - path: Sources/AgentBuddyWatchComplications/AgentBuddyServerListPayload.swift
      - path: Sources/AgentBuddyWatchComplications/AgentBuddyComplicationEntry.swift
      - path: Sources/AgentBuddyWatchComplications/AgentBuddyRunningTurnPayload.swift
    resources:
      - path: Sources/AgentBuddy/Resources/Fonts
      - path: Sources/AgentBuddy/Resources/Themes
      - path: Sources/AgentBuddy/Resources/home_cat.png
      - path: Sources/AgentBuddy/Resources/home_cat_entrance.png
    dependencies:
      - sdk: CarPlay.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: WebRTC
        product: WebRTC
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashark.agentbuddy
        INFOPLIST_KEY_CFBundleDisplayName: "AgentBuddy"
        INFOPLIST_FILE: Sources/AgentBuddy/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AgentBuddy/Bridge/codex_bridge_objc.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIBackgroundModes: "audio fetch remote-notification picture-in-picture"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  AgentBuddyMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    entitlements:
      path: Sources/AgentBuddy/AgentBuddy-Catalyst.entitlements
      properties:
        aps-environment: production
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.akashark.agentbuddy` exists in the Apple Developer Portal
        # AND the Mac App Store profile is regenerated to include the iCloud
        # capability. Direct-dist (DeveloperID entitlements) keeps the key
        # because Developer ID apps validate iCloud at runtime, not via profile.
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.akashark.agentbuddy
        com.apple.security.application-groups:
          - group.com.akashark.agentbuddy
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    sources:
      - path: Sources/AgentBuddy
        excludes:
          - CarPlay/**
          - Info.plist
          - AgentBuddy.entitlements
          - AgentBuddy-Catalyst.entitlements
          - AgentBuddy-Catalyst-DeveloperID.entitlements
          - Models/AppLifecycleController.swift
          - Models/AppRuntimeController.swift
          - Models/CodexTurnAttributes.swift
          - Models/CodexVoiceCallAttributes.swift
          - Models/OrientationResponder.swift
          - Models/RealtimeWebRtcSession.swift
          - Models/StableSafeAreaInsets.swift
          - Models/TurnLiveActivityController.swift
          - Models/VoiceRuntimeController.swift
          - Models/VoiceSessionControl.swift
          - Models/VoiceSessionModels.swift
          - Models/WatchCompanionBridge.swift
          - Models/WatchProjection.swift
          - Views/HomeVoiceOrbButton.swift
          - Views/InlineVoiceButton.swift
          - Views/InlineVoiceStatusStrip.swift
          - Views/LiveActivityPreview.swift
          - Views/LockScreenCardView.swift
          - Views/RealtimeVoiceScreen.swift
          - Views/VoiceCallView.swift
          - "**/*.h"
      - path: Sources/AgentBuddy/Bridge/UniFFICodexClient.generated.swift
    resources:
      - path: Sources/AgentBuddy/Resources/Fonts
      - path: Sources/AgentBuddy/Resources/Themes
      - path: Sources/AgentBuddy/Resources/home_cat.png
      - path: Sources/AgentBuddy/Resources/home_cat_entrance.png
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_NAME: AgentBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.akashark.agentbuddy
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Sources/AgentBuddy/Info-Catalyst.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AgentBuddy/Bridge/codex_bridge_objc.h
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-macabi"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        # Direct-distribution (notarized .dmg) lane. Re-points
        # CODE_SIGN_ENTITLEMENTS at the unsandboxed entitlements file so the
        # Mac build can spawn a local `codex app-server`. Same automatic
        # signing flow as Release; the actual cert is selected via the
        # APP_CODE_SIGN_IDENTITY override the script passes through.
        DeveloperID:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: Sources/AgentBuddy/AgentBuddy-Catalyst-DeveloperID.entitlements
  AgentBuddyLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/AgentBuddyLiveActivity/AgentBuddyLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.akashark.agentbuddy
    sources:
      - path: Sources/AgentBuddyLiveActivity
      - path: Sources/AgentBuddy/Models/CodexTurnAttributes.swift
      - path: Sources/AgentBuddy/Models/CodexVoiceCallAttributes.swift
      - path: Sources/AgentBuddy/Models/AgentBuddyPalette.swift
      - path: Sources/AgentBuddy/Models/VoiceSessionControl.swift
      - path: Sources/AgentBuddy/Views/LockScreenCardView.swift
    resources:
      - path: Sources/AgentBuddyLiveActivity/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashark.agentbuddy.liveactivity
        INFOPLIST_FILE: Sources/AgentBuddyLiveActivity/Info.plist
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_DEBUG_DYLIB: NO
        Release:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(LIVE_ACTIVITY_CODE_SIGN_IDENTITY)"
          LIVE_ACTIVITY_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
  AgentBuddyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/AgentBuddyWatch/AgentBuddyWatch.entitlements
      properties:
        aps-environment: production
        com.apple.security.application-groups:
          - group.com.akashark.agentbuddy
    sources:
      - path: Sources/AgentBuddyWatch
        excludes:
          - "Assets.xcassets"
      - path: Sources/AgentBuddy/AppIcon.icon
    resources:
      - path: Sources/AgentBuddy/Resources/Fonts
      - path: Sources/AgentBuddyWatch/Assets.xcassets
    dependencies:
      - target: AgentBuddyWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashark.agentbuddy.watchkitapp
        INFOPLIST_FILE: Sources/AgentBuddyWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        GENERATE_INFOPLIST_FILE: NO
        SDKROOT: watchos
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_CODE_SIGN_IDENTITY)"
          WATCH_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""

  AgentBuddyWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/AgentBuddyWatchComplications/AgentBuddyWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.akashark.agentbuddy
    sources:
      - path: Sources/AgentBuddyWatchComplications
        excludes:
          - "Assets.xcassets"
    resources:
      - path: Sources/AgentBuddyWatchComplications/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashark.agentbuddy.watchkitapp.complications
        INFOPLIST_FILE: Sources/AgentBuddyWatchComplications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SDKROOT: watchos
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_COMP_CODE_SIGN_IDENTITY)"
          WATCH_COMP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""

  AgentBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AgentBuddyTests
    dependencies:
      - target: AgentBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
  AgentBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AgentBuddyUITests
      - path: SnapshotHelper.swift
    dependencies:
      - target: AgentBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: AgentBuddy
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false

schemes:
  AgentBuddyWatch:
    build:
      targets:
        AgentBuddyWatch: all
        AgentBuddyWatchComplications: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 2
  AgentBuddy:
    build:
      targets:
        AgentBuddy: all
    run:
      config: Debug
      customLLDBInit: $(SRCROOT)/.lldbinit
    test:
      config: Debug
      targets:
        - AgentBuddyTests
        - AgentBuddyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 1
  AgentBuddyMac:
    build:
      targets:
        AgentBuddyMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    # Default archive uses Release (sandboxed) for the App Store lane.
    # The direct-distribution script overrides via `-configuration DeveloperID`.
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 3

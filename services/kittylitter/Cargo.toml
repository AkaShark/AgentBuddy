[workspace]

[package]
# Daemon binary bundled as the desktop app's sidecar; the installed command is `agentbuddy`.
name = "agentbuddycli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["The Alleycat Authors", "AgentBuddy"]
repository = "https://github.com/AkaShark/AgentBuddy"
homepage = "https://github.com/AkaShark/AgentBuddy"
description = "AgentBuddy（搭子）Mac 端：Iroh P2P 守护进程，把本地编码 agent（Codex/Pi/OpenCode/Claude）多路复用给已配对的搭子 App。"
readme = "README.md"

[[bin]]
name = "agentbuddy"
path = "src/main.rs"

[dependencies]
# [litter-fork] Pinned to an explicit commit of the AkaShark/alleycat fork for
# reproducible builds / GPLv3 source-correspondence (was: branch = "main").
# tools/scripts/update-alleycat-main.sh leaves this rev alone unless you opt in
# with AGENTBUDDY_REFRESH_ALLEYCAT=1, so normal builds never float it.
# ac8b1d1 is the head of the fork branch feat/host-push-notifications, which
# holds all AgentBuddy changes to alleycat: host push subscriptions, the
# MyFlicker agent and ACP bridge fixes (AkaShark/alleycat#2, merged into it),
# and ACP turn/start answering while the prompt runs.
# AgentBuddy maintains alleycat on that branch; the fork main tracks upstream
# and is not used (AkaShark/alleycat#1 was closed without merging).
alleycat = { git = "https://github.com/AkaShark/alleycat.git", rev = "ac8b1d16190e21dfcc4ab28636e765bd73b0d22f" }
anyhow = "1"

[profile.release]
lto = "thin"

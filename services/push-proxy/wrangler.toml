name = "agentbuddy-push-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
# [litter-fork] Author's custom domain removed; deploy on the free *.workers.dev
# subdomain. The iOS client points its PushProxyClient.baseURL at that URL.

[durable_objects]
bindings = [
  { name = "PUSH_REGISTRATION", class_name = "PushRegistration" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "HOST_CHANNEL", class_name = "HostChannel" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushRegistration"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# v2 push protocol: one HostChannel object per host (idFromName(hostId)).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["HostChannel"]

# Secrets (set with `wrangler secret put`, never committed): APNS_TEAM_ID,
# APNS_KEY_ID, APNS_PRIVATE_KEY, FCM_PROJECT_ID, FCM_CLIENT_EMAIL,
# FCM_PRIVATE_KEY, PUSH_TARGET_SEAL_KEY (required by POST /v2/subscriptions),
# and the optional DEBUG_PUSH_ADMIN_TOKEN.
# Optional var PUSH_AUDIENCE overrides the signed `aud` (default: request origin).
[vars]
APNS_TOPIC = "com.akashark.agentbuddy"
# Never commit "true": enable per deploy with
# `npx wrangler deploy --var DEBUG_PUSH_ENABLED:true` (see README).
DEBUG_PUSH_ENABLED = "false"
LEGACY_KEEPALIVE_ENABLED = "true"
BLOCKED_HOST_IDS = ""
